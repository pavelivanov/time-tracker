appId: com.pavelivanov.timetracker
productName: Time Tracker
directories:
  buildResources: build
  output: dist
# Whitelist; production node_modules are added by electron-builder.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true
  # Personal build: ad-hoc signature, no notarization (see SPEC.md §14.1).
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
npmRebuild: false
